<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Переход в Steam</title>
<style>
:root{ --bg:#0d0a14; --card:#15101f; --line:#2c2340; --text:#f1eefa; --muted:#a59cbf; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main{ width:100%; max-width:420px; padding:24px 16px; text-align:center; }
h1{ font-size:20px; margin:0 0 8px; }
p{ color:var(--muted); margin:0 0 20px; }
.btn{ display:block; width:100%; padding:14px; border:0; border-radius:12px; color:#fff; font:600 16px/1 inherit; text-decoration:none; background:linear-gradient(90deg,#7c3aed,#db2777); cursor:pointer; }
.btn.secondary{ margin-top:10px; background:var(--card); border:1px solid var(--line); }
.err{ color:#fca5a5; }
</style>
</head>
<body>
<main>
<h1 id="title">Открываю Steam…</h1>
<p id="hint">Если страница не открылась сама, нажми кнопку ниже.</p>
<a class="btn" id="go" href="#">Открыть в Steam</a>
<button class="btn secondary" id="copy" type="button">Скопировать ссылку</button>
</main>
<script>
// Переходник для ссылок обмена Steam из мини-аппа. На iPhone с приложением
// Steam Telegram отдаёт ссылку tradeoffer приложению, и та молча теряется;
// переход отсюда скриптом остаётся в браузере. Ведём только на
// steamcommunity.com — чтобы страницу нельзя было использовать для
// перенаправления куда угодно.
(function(){
var to = new URLSearchParams(location.search).get('to') || '';
var ok = false;
try { var u = new URL(to); ok = u.protocol === 'https:' && u.hostname === 'steamcommunity.com'; } catch (e) {}
var title = document.getElementById('title');
var go = document.getElementById('go');
var copy = document.getElementById('copy');
if (!ok){
title.textContent = 'Ссылка не похожа на ссылку Steam';
title.className = 'err';
document.getElementById('hint').textContent = 'Вернись в мини-апп и попробуй ещё раз.';
go.style.display = 'none';
copy.style.display = 'none';
return;
}
go.href = to;
// Страница трейд-ссылки (а не обмен) — подсказка, что делать дальше.
if (/\/tradeoffers\/privacy/.test(to)){
document.getElementById('hint').textContent = 'Войди в Steam, если попросит. Внизу страницы скопируй трейд-ссылку и вставь её в мини-апп. Если страница не открылась сама, нажми кнопку ниже.';
}
copy.addEventListener('click', function(){
var done = function(){ copy.textContent = 'Скопировано — вставь в браузер'; };
if (navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(to).then(done, function(){ prompt('Скопируй ссылку:', to); });
} else {
prompt('Скопируй ссылку:', to);
}
});
// back=1 — переходник открыт прямо в мини-аппе (Telegram не открыл
// браузер): не уводим сразу, а даём кнопку «Вернуться в маркет».
var back = new URLSearchParams(location.search).get('back') === '1';
if (back){
title.textContent = 'Переход в Steam';
document.getElementById('hint').textContent = 'Нажми «Открыть в Steam». Чтобы потом вернуться в маркет — закрой и снова открой мини-апп (или нажми «Вернуться в маркет» здесь).';
var ret = document.createElement('a');
ret.className = 'btn secondary';
ret.href = '/';
ret.textContent = '← Вернуться в маркет';
copy.after(ret);
return;
}
setTimeout(function(){ location.replace(to); }, 300);
})();
</script>
</body>
</html>
