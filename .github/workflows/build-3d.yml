# Сборка 3D-моделей и раскрасок на серверах GitHub — вместо Codespaces.
#
# Запускается сама каждые 6 часов и вручную (Actions → «3D: сборка
# моделей» → Run workflow). Каждый запуск продолжает с того места, где
# остановился прошлый: build-all.sh пропускает готовое и коммитит
# после каждой раскраски.
#
# Готовые файлы живут не в main, а в отдельной ветке 3d-assets: оттуда
# их выкладывает в Cloudflare Pages workflow deploy-3d.yml (он
# запускается сам после каждой сборки). Так сайт на GitHub Pages не
# упирается в лимит 1 ГБ.
#
# Нужны секреты репозитория (Settings → Secrets and variables →
# Actions): STEAM_USERNAME и STEAM_PASSWORD — ОТДЕЛЬНЫЙ аккаунт Steam
# без мобильного Steam Guard, с бесплатной CS2 в библиотеке. Сервер
# не может ввести код подтверждения.
name: "3D: сборка моделей"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти стволы, через пробел (пусто — все)"
        required: false
        default: ""

# Два запуска одновременно писали бы в одни и те же файлы.
concurrency:
  group: build-3d
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORK: /tmp/cs2-assets
  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}

jobs:
  # Пока секретов нет, запуск по расписанию тихо пропускается (без
  # писем об ошибке); ручной запуск честно падает с подсказкой.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Секреты Steam на месте?
        id: secrets
        env:
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          if [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_PASSWORD" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Нет секретов STEAM_USERNAME / STEAM_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          else
            echo "::notice::Секретов Steam ещё нет — сборка пропущена."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Ветка с готовыми моделями и раскрасками — сюда пишет сборка.
      - uses: actions/checkout@v4
        with:
          ref: 3d-assets
          path: assets
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h / /tmp

      - name: Python-зависимости
        run: pip install --quiet Pillow

      # Токен входа DepotDownloader (-remember-password) лежит в
      # IsolatedStorage — сохраняем между запусками, чтобы не входить
      # по паролю каждый раз.
      - name: Токен Steam из прошлого запуска
        uses: actions/cache@v4
        with:
          path: ~/.local/share/IsolatedStorage
          key: steam-login-${{ github.run_id }}
          restore-keys: steam-login-

      # Инструменты качаются с GitHub и закреплены ссылкой и sha256 —
      # подменённый релиз не попадёт в сборку. Обновить: очистить поля
      # env ниже, запустить сборку — она возьмёт последний релиз и
      # напечатает его ссылку и sha256, их и перенести сюда.
      - name: Инструменты (DepotDownloader, Source2Viewer)
        env:
          DD_URL: "https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-framework.zip"
          DD_SHA256: "7419f65efb7eb16b6e56987ed1b76475f29c02475c0016166c84798388e796bc"
          S2V_URL: "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/20.0/cli-linux-x64.zip"
          S2V_SHA256: "3e8af47cd6ce52e8068904f2aa1dda23c56a6b96a8310b25090f0711cda76a8a"
        run: |
          mkdir -p "$WORK/tools" "$WORK/game"
          cd "$WORK/tools"
          fetch() {  # имя, ссылка, sha256 (может быть пустым)
            curl -fsSL "$2" -o "$1"
            sum=$(sha256sum "$1" | cut -d' ' -f1)
            if [ -n "$3" ]; then
              [ "$sum" = "$3" ] || { echo "::error::$1: sha256 не совпал ($sum), ожидался $3 — архив подменён или обновлён"; exit 1; }
            else
              echo "::notice::$1 не закреплён: $2 sha256=$sum"
            fi
          }
          dd="$DD_URL"
          [ -z "$dd" ] && dd=$(curl -s https://api.github.com/repos/SteamRE/DepotDownloader/releases/latest \
               | grep -o 'https://[^"]*DepotDownloader-framework.zip' | head -1)
          fetch dd.zip "${dd:-https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-framework.zip}" "$DD_SHA256"
          s2v="$S2V_URL"
          [ -z "$s2v" ] && s2v=$(curl -s https://api.github.com/repos/ValveResourceFormat/ValveResourceFormat/releases/latest \
               | grep -o 'https://[^"]*cli-linux-x64.zip' | head -1)
          fetch s2v.zip "${s2v:-https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/20.0/cli-linux-x64.zip}" "$S2V_SHA256"
          unzip -oq dd.zip && unzip -oq s2v.zip && rm dd.zip s2v.zip
          chmod +x Source2Viewer-CLI
          ls -la

      # Один вход — и сразу весь архив игры (pak01_*.vpk, десятки ГБ —
      # место на сервере есть). Раньше скрипты входили в Steam ради
      # каждого куска, и Steam отвечал RateLimitExceeded. stdin закрыт:
      # если Steam попросит код, шаг упадёт с понятной ошибкой.
      - name: Вход в Steam и архив игры
        env:
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          printf 'regex:^game/csgo/pak01_.*\\.vpk$\n' > "$WORK/filelist-dir.txt"
          cd "$WORK/tools"
          # Steam иногда рвёт соединение посреди скачивания («Lost
          # connection to Steam», «not completely downloaded») — повторяем;
          # уже скачанное DepotDownloader не качает заново.
          for attempt in 1 2 3; do
            dotnet DepotDownloader.dll -app 730 -username "$STEAM_USERNAME" -password "$STEAM_PASSWORD" \
                 -remember-password -filelist "$WORK/filelist-dir.txt" -dir "$WORK/game" < /dev/null 2>&1 | tee "$WORK/login.log" || true
            grep -qiE "STEAM GUARD|InvalidPassword|Failed to authenticate" "$WORK/login.log" && break
            if [ -f "$WORK/game/game/csgo/pak01_dir.vpk" ] && ! grep -q "not completely downloaded" "$WORK/login.log"; then
              break
            fi
            echo "::warning::Скачивание архива прервалось (попытка $attempt) — повторяю через 60 с."
            sleep 60
          done
          if grep -q "STEAM GUARD" "$WORK/login.log"; then
            echo "::error::На аккаунте включён Steam Guard (код на почту или в приложении) — сервер не может его ввести. Отключите Steam Guard на этом отдельном аккаунте: Steam → Настройки → Безопасность → Управление Steam Guard → «Отключить Steam Guard»."
            exit 1
          fi
          if grep -qiE "InvalidPassword|Failed to authenticate" "$WORK/login.log"; then
            echo "::error::Steam не принял логин или пароль — проверьте секреты STEAM_USERNAME / STEAM_PASSWORD."
            exit 1
          fi
          ls -la "$WORK/game/game/csgo/pak01_dir.vpk"
          echo "Кусков архива: $(ls "$WORK"/game/game/csgo/pak01_*.vpk | wc -l), размер: $(du -sh "$WORK/game" | cut -f1)"
          df -h /tmp

      # Скрипты берём из main, а работаем в папке ветки 3d-assets:
      # build-all.sh коммитит только models/, скрипты в ветку не попадут.
      - name: Git
        run: |
          cp "$GITHUB_WORKSPACE"/*.sh "$GITHUB_WORKSPACE/assets/"
          cd "$GITHUB_WORKSPACE/assets"
          git config user.name "DGhost 3D bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Проба (only = probe): только печатает из индекса архива файлы
      # стволов и composite_inputs — по ним ищем маски HD-корпусов.
      # Ничего не собирает и не коммитит.
      - name: Проба архива
        if: inputs.only == 'probe'
        run: |
          T="$WORK/tools/Source2Viewer-CLI"
          export STEAM_USER="$STEAM_USERNAME"
          "$T" -i "$WORK/game/game/csgo/pak01_dir.vpk" --vpk_dir > "$WORK/vpk_dir.txt" 2>/dev/null || true
          wc -l "$WORK/vpk_dir.txt"
          echo "::group::composite_inputs"
          grep -i 'composite_input' "$WORK/vpk_dir.txt" | head -80
          echo "::endgroup::"
          for w in m249 m4a1_silencer ak47; do
            echo "::group::$w"
            grep -i "weapons/models/$w/" "$WORK/vpk_dir.txt" | grep -viE 'sticker|\.vmdl|\.vphys|\.vanim|anim' | head -80
            echo "::endgroup::"
          done
          # Фоны главного меню и картинки карт — для фона 3D «как в CS».
          echo "::group::фоны"
          grep -iE '^panorama/images/' "$WORK/vpk_dir.txt" | grep -iE 'map_icons/screenshots|background|mainmenu|maps?/' | grep -viE 'sound|particle|\.vcss|\.vjs' | sed 's/ crc=.*//' | head -150
          echo "--- maps/ui"
          grep -iE '^maps/(ui|backgrounds)' "$WORK/vpk_dir.txt" | sed 's/ crc=.*//' | head -40
          ls "$WORK/game/game/csgo/maps" 2>/dev/null | head -40
          echo "::endgroup::"
          # Выемка HD-набора и статистика каналов исходных PNG.
          for w in m249 ak47; do
            rm -rf "$WORK/export-model"
            (cd "$GITHUB_WORKSPACE/assets" && bash fix-model.sh "$w" > "$WORK/probe-$w.log" 2>&1) || true
            echo "::group::$w composite_inputs.vmat"
            find "$WORK/export-model" -path '*weapons/models/*composite_inputs*.vmat' -exec cat {} \; | grep -iE 'g_t|F_|g_b|g_fl|g_v' | head -60
            echo "::endgroup::"
            echo "::group::$w PNG"
            python3 - "$WORK/export-model" <<'PY'
          import os, sys
          from PIL import Image
          for path, dirs, files in os.walk(sys.argv[1]):
              for f in sorted(files):
                  if not f.endswith('.png'):
                      continue
                  p = os.path.join(path, f)
                  im = Image.open(p)
                  ext = im.getextrema()
                  print(p.split('export-model/')[-1], im.mode, im.size, ext)
          PY
            echo "::endgroup::"
          done
          echo "::group::masks (всё)"
          grep -iE '_masks?[_.]' "$WORK/vpk_dir.txt" | grep -i 'weapons/models' | head -80
          echo "::endgroup::"

      # Проба анимаций (only = probe-anim): руки и анимации осмотра ножа,
      # экспорт в glb — см. probe-anim.sh. Ничего не коммитит.
      - name: Проба анимаций
        if: inputs.only == 'probe-anim'
        run: |
          cd "$GITHUB_WORKSPACE/assets"
          STEAM_USER="$STEAM_USERNAME" bash probe-anim.sh

      # Комплект анимаций ножа (only = anim:<нож>, например anim:knife_butterfly):
      # руки и клипы в models/anim/<нож>/ ветки 3d-assets.
      - name: Анимации ножа
        if: startsWith(inputs.only, 'anim:')
        env:
          REPO: ${{ github.workspace }}/assets
          ONLY: ${{ inputs.only }}
        run: |
          cd "$REPO"
          KNIFE="${ONLY#anim:}" STEAM_USER="$STEAM_USERNAME" bash build-anim.sh
          if [ -n "$(git status --porcelain models)" ]; then
            git add models
            git commit -q -m "3D: анимации ${ONLY#anim:}"
            git push -q || { git pull -q --rebase && git push -q; }
          fi

      # Останавливаемся за полчаса до лимита задачи: всё собранное уже
      # закоммичено, следующий запуск продолжит.
      - name: Сборка
        if: ${{ !startsWith(inputs.only, 'probe') && !startsWith(inputs.only, 'anim:') }}
        env:
          REPO: ${{ github.workspace }}/assets
          ONLY: ${{ inputs.only }}
          KEEP_CHUNKS: "1"
          # Ножи — после всех стволов (build-all.sh ставит их в конец).
          INCLUDE_KNIVES: "1"
          # У Cloudflare Pages нет лимита по объёму (есть 20 000 файлов
          # и 25 МБ на файл) — потолок только чтобы ветка не раздувалась.
          MAX_MODELS_MB: "6000"
        run: |
          cd "$REPO"
          code=0
          timeout --signal=INT 320m bash build-all.sh || code=$?
          if [ "$code" = "124" ]; then
            echo "⏱ Время запуска вышло — продолжим в следующий раз."
            code=0
          fi
          exit $code

      # Диапазоны pattern seed (сдвиг и поворот узора) для всех готовых
      # раскрасок — из рецептов игры; считается только для новых.
      - name: Pattern seed
        if: always() && !startsWith(inputs.only, 'probe') && !startsWith(inputs.only, 'anim:')
        env:
          REPO: ${{ github.workspace }}/assets
        run: |
          cd "$REPO"
          # Сборка не дошла до копирования скриптов (например, Steam не
          # отдал архив) — считать нечего.
          [ -f build-seed.sh ] || { echo "Скриптов нет — шаг пропущен."; exit 0; }
          bash build-seed.sh
          if [ -n "$(git status --porcelain models)" ]; then
            git add models
            git commit -q -m "3D: диапазоны pattern seed"
            git push -q || { git pull -q --rebase && git push -q; }
          fi

      # Те же рецепты — текстом в ветку 3d-assets (папка recipes/, в
      # Cloudflare не выкладывается): артефакты GitHub лежат на хосте,
      # закрытом для облачного окружения, где их разбирают.
      - name: Рецепты раскрасок (в ветку)
        if: always() && !startsWith(inputs.only, 'probe') && !startsWith(inputs.only, 'anim:')
        run: |
          [ -d "$WORK/export-recipes" ] || { echo "Рецептов нет — шаг пропущен."; exit 0; }
          cd "$GITHUB_WORKSPACE/assets"
          mkdir -p recipes
          cp -r "$WORK/export-recipes/." recipes/
          if [ -n "$(git status --porcelain recipes)" ]; then
            git add recipes
            git commit -q -m "3D: рецепты раскрасок (текст)"
            git push -q || { git pull -q --rebase && git push -q; }
          fi
          du -sh recipes

      # Все рецепты раскрасок (vcompmat в текстовом виде) и шаблоны
      # стилей — архивом к запуску: по ним разбираем, как игра собирает
      # раскраски нового формата (Printstream и др.), не гадая по логу.
      - name: Рецепты раскрасок (архив)
        if: always() && !startsWith(inputs.only, 'probe') && !startsWith(inputs.only, 'anim:')
        uses: actions/upload-artifact@v4
        with:
          name: recipes
          path: /tmp/cs2-assets/export-recipes
          retention-days: 14
          if-no-files-found: ignore

      # Логи того, что не собралось в этом запуске, — прямо в журнал
      # задачи, чтобы разбирать ошибки без доступа к серверу.
      - name: Логи неудач
        if: always() && !startsWith(inputs.only, 'probe') && !startsWith(inputs.only, 'anim:')
        run: |
          cd "$GITHUB_WORKSPACE/assets"
          shown=0
          # Сначала модели (их мало, и без модели не будет всего ствола), потом раскраски.
          for f in $(ls -t "$WORK"/build-*.log 2>/dev/null | grep -v '/build-skin-'; ls -t "$WORK"/build-skin-*.log 2>/dev/null); do
            name=$(basename "$f" .log); name=${name#build-}
            case "$name" in
              index|plan) continue ;;
              skin-*) kit=${name#skin-}
                      if [ -f "models/skins/$kit/pattern.webp" ] || [ -f "models/skins/$kit/params.json" ]; then continue; fi ;;
              *)      if [ -f "models/weapons/$name/masks.webp" ]; then continue; fi ;;
            esac
            echo "::group::$name"
            tail -60 "$f"
            echo "::endgroup::"
            shown=$((shown + 1))
            [ "$shown" -ge 25 ] && break
          done
          echo "Показано логов неудач: $shown"
