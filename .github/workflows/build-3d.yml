# Сборка 3D-моделей и раскрасок на серверах GitHub — вместо Codespaces.
#
# Запускается сама каждые 6 часов и вручную (Actions → «3D: сборка
# моделей» → Run workflow). Каждый запуск продолжает с того места, где
# остановился прошлый: build-all.sh пропускает готовое и коммитит
# после каждой раскраски.
#
# Готовые файлы живут не в main, а в отдельной ветке 3d-assets: оттуда
# их выкладывает в Cloudflare Pages workflow deploy-3d.yml (он
# запускается сам после каждой сборки). Так сайт на GitHub Pages не
# упирается в лимит 1 ГБ.
#
# Нужны секреты репозитория (Settings → Secrets and variables →
# Actions): STEAM_USERNAME и STEAM_PASSWORD — ОТДЕЛЬНЫЙ аккаунт Steam
# без мобильного Steam Guard, с бесплатной CS2 в библиотеке. Сервер
# не может ввести код подтверждения.
name: "3D: сборка моделей"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Только эти стволы, через пробел (пусто — все)"
        required: false
        default: ""

# Два запуска одновременно писали бы в одни и те же файлы.
concurrency:
  group: build-3d
  cancel-in-progress: false

permissions:
  contents: write

env:
  WORK: /tmp/cs2-assets
  STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}

jobs:
  # Пока секретов нет, запуск по расписанию тихо пропускается (без
  # писем об ошибке); ручной запуск честно падает с подсказкой.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Секреты Steam на месте?
        id: secrets
        env:
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          if [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_PASSWORD" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Нет секретов STEAM_USERNAME / STEAM_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          else
            echo "::notice::Секретов Steam ещё нет — сборка пропущена."
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Ветка с готовыми моделями и раскрасками — сюда пишет сборка.
      - uses: actions/checkout@v4
        with:
          ref: 3d-assets
          path: assets
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h / /tmp

      - name: Python-зависимости
        run: pip install --quiet Pillow

      # Токен входа DepotDownloader (-remember-password) лежит в
      # IsolatedStorage — сохраняем между запусками, чтобы не входить
      # по паролю каждый раз.
      - name: Токен Steam из прошлого запуска
        uses: actions/cache@v4
        with:
          path: ~/.local/share/IsolatedStorage
          key: steam-login-${{ github.run_id }}
          restore-keys: steam-login-

      # Инструменты качаются с GitHub. Чтобы подменённый релиз не попал
      # в сборку, их можно закрепить: вписать в env ниже ссылку и
      # sha256 — тогда архив сверяется с хешем. Пока поля пустые, берётся
      # последний релиз, а его ссылка и sha256 печатаются в журнал (их и
      # переносить сюда).
      - name: Инструменты (DepotDownloader, Source2Viewer)
        env:
          DD_URL: ""
          DD_SHA256: ""
          S2V_URL: ""
          S2V_SHA256: ""
        run: |
          mkdir -p "$WORK/tools" "$WORK/game"
          cd "$WORK/tools"
          fetch() {  # имя, ссылка, sha256 (может быть пустым)
            curl -fsSL "$2" -o "$1"
            sum=$(sha256sum "$1" | cut -d' ' -f1)
            if [ -n "$3" ]; then
              [ "$sum" = "$3" ] || { echo "::error::$1: sha256 не совпал ($sum), ожидался $3 — архив подменён или обновлён"; exit 1; }
            else
              echo "::notice::$1 не закреплён: $2 sha256=$sum"
            fi
          }
          dd="$DD_URL"
          [ -z "$dd" ] && dd=$(curl -s https://api.github.com/repos/SteamRE/DepotDownloader/releases/latest \
               | grep -o 'https://[^"]*DepotDownloader-framework.zip' | head -1)
          fetch dd.zip "${dd:-https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-framework.zip}" "$DD_SHA256"
          s2v="$S2V_URL"
          [ -z "$s2v" ] && s2v=$(curl -s https://api.github.com/repos/ValveResourceFormat/ValveResourceFormat/releases/latest \
               | grep -o 'https://[^"]*cli-linux-x64.zip' | head -1)
          fetch s2v.zip "${s2v:-https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/20.0/cli-linux-x64.zip}" "$S2V_SHA256"
          unzip -oq dd.zip && unzip -oq s2v.zip && rm dd.zip s2v.zip
          chmod +x Source2Viewer-CLI
          ls -la

      # Один вход — и сразу весь архив игры (pak01_*.vpk, десятки ГБ —
      # место на сервере есть). Раньше скрипты входили в Steam ради
      # каждого куска, и Steam отвечал RateLimitExceeded. stdin закрыт:
      # если Steam попросит код, шаг упадёт с понятной ошибкой.
      - name: Вход в Steam и архив игры
        env:
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          printf 'regex:^game/csgo/pak01_.*\\.vpk$\n' > "$WORK/filelist-dir.txt"
          cd "$WORK/tools"
          if ! dotnet DepotDownloader.dll -app 730 -username "$STEAM_USERNAME" -password "$STEAM_PASSWORD" \
               -remember-password -filelist "$WORK/filelist-dir.txt" -dir "$WORK/game" < /dev/null 2>&1 | tee "$WORK/login.log"; then
            :
          fi
          if grep -q "STEAM GUARD" "$WORK/login.log"; then
            echo "::error::На аккаунте включён Steam Guard (код на почту или в приложении) — сервер не может его ввести. Отключите Steam Guard на этом отдельном аккаунте: Steam → Настройки → Безопасность → Управление Steam Guard → «Отключить Steam Guard»."
            exit 1
          fi
          if grep -qiE "InvalidPassword|Failed to authenticate" "$WORK/login.log"; then
            echo "::error::Steam не принял логин или пароль — проверьте секреты STEAM_USERNAME / STEAM_PASSWORD."
            exit 1
          fi
          ls -la "$WORK/game/game/csgo/pak01_dir.vpk"
          echo "Кусков архива: $(ls "$WORK"/game/game/csgo/pak01_*.vpk | wc -l), размер: $(du -sh "$WORK/game" | cut -f1)"
          df -h /tmp

      # Скрипты берём из main, а работаем в папке ветки 3d-assets:
      # build-all.sh коммитит только models/, скрипты в ветку не попадут.
      - name: Git
        run: |
          cp "$GITHUB_WORKSPACE"/*.sh "$GITHUB_WORKSPACE/assets/"
          cd "$GITHUB_WORKSPACE/assets"
          git config user.name "DGhost 3D bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Останавливаемся за полчаса до лимита задачи: всё собранное уже
      # закоммичено, следующий запуск продолжит.
      - name: Сборка
        env:
          REPO: ${{ github.workspace }}/assets
          ONLY: ${{ inputs.only }}
          KEEP_CHUNKS: "1"
          # У Cloudflare Pages нет лимита по объёму (есть 20 000 файлов
          # и 25 МБ на файл) — потолок только чтобы ветка не раздувалась.
          MAX_MODELS_MB: "6000"
        run: |
          cd "$REPO"
          code=0
          timeout --signal=INT 320m bash build-all.sh || code=$?
          if [ "$code" = "124" ]; then
            echo "⏱ Время запуска вышло — продолжим в следующий раз."
            code=0
          fi
          exit $code

      # Диапазоны pattern seed (сдвиг и поворот узора) для всех готовых
      # раскрасок — из рецептов игры; считается только для новых.
      - name: Pattern seed
        if: always()
        env:
          REPO: ${{ github.workspace }}/assets
        run: |
          cd "$REPO"
          bash build-seed.sh
          if [ -n "$(git status --porcelain models)" ]; then
            git add models
            git commit -q -m "3D: диапазоны pattern seed"
            git push -q || { git pull -q --rebase && git push -q; }
          fi

      # Логи того, что не собралось в этом запуске, — прямо в журнал
      # задачи, чтобы разбирать ошибки без доступа к серверу.
      - name: Логи неудач
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/assets"
          shown=0
          # Сначала модели (их мало, и без модели не будет всего ствола), потом раскраски.
          for f in $(ls -t "$WORK"/build-*.log 2>/dev/null | grep -v '/build-skin-'; ls -t "$WORK"/build-skin-*.log 2>/dev/null); do
            name=$(basename "$f" .log); name=${name#build-}
            case "$name" in
              index|plan) continue ;;
              skin-*) kit=${name#skin-}
                      if [ -f "models/skins/$kit/pattern.webp" ] || [ -f "models/skins/$kit/params.json" ]; then continue; fi ;;
              *)      if [ -f "models/weapons/$name/masks.webp" ]; then continue; fi ;;
            esac
            echo "::group::$name"
            tail -60 "$f"
            echo "::endgroup::"
            shown=$((shown + 1))
            [ "$shown" -ge 25 ] && break
          done
          echo "Показано логов неудач: $shown"
