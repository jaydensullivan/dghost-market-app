# Выкладка 3D-файлов (ветка 3d-assets, папка models/) в Cloudflare Pages.
#
# Запускается сама после каждой сборки «3D: сборка моделей», при пуше
# в 3d-assets и вручную (Actions → «3D: выкладка в Cloudflare» → Run
# workflow). Мини-апп берёт файлы оттуда (MODELS_CDN в app-3d.js), а
# если Cloudflare не отвечает — со своего сайта.
#
# Нужны секреты репозитория (Settings → Secrets and variables →
# Actions): CLOUDFLARE_API_TOKEN (токен с правом Cloudflare Pages:
# Edit) и CLOUDFLARE_ACCOUNT_ID. Пока их нет, автоматические запуски
# тихо пропускаются.
name: "3D: выкладка в Cloudflare"

on:
  workflow_run:
    workflows: ["3D: сборка моделей"]
    types: [completed]
  push:
    branches: [3d-assets]
  workflow_dispatch:

concurrency:
  group: deploy-3d
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: dghost-3d
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Секреты Cloudflare на месте?
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Нет секретов CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            exit 1
          else
            echo "::notice::Секретов Cloudflare ещё нет — выкладка пропущена."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == '1'
        with:
          ref: 3d-assets
          path: assets
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == '1'
        with:
          node-version: "22"

      # Отдельная папка без .git. _headers разрешает мини-аппу (другой
      # домен) читать файлы: без этого браузер не отдаст их WebGL.
      - name: Подготовить файлы
        if: steps.secrets.outputs.ready == '1'
        run: |
          mkdir -p cf
          cp -r assets/models cf/models
          printf '/*\n  Access-Control-Allow-Origin: *\n' > cf/_headers
          files=$(find cf -type f | wc -l)
          echo "Файлов: $files (лимит Cloudflare Pages — 20 000), размер: $(du -sh cf | cut -f1)"
          big=$(find cf -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::Файлы больше 25 МБ Cloudflare Pages не примет:"; echo "$big"; exit 1
          fi
          if [ "$files" -gt 19500 ]; then
            echo "::error::Файлов почти 20 000 — это лимит Cloudflare Pages, пора переходить на R2."; exit 1
          fi

      - name: Проект Cloudflare Pages
        if: steps.secrets.outputs.ready == '1'
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi

      # Cloudflare сравнивает файлы по хешу и заново качает только новые.
      - name: Выложить
        if: steps.secrets.outputs.ready == '1'
        run: |
          npx --yes wrangler@4 pages deploy cf --project-name "$PROJECT" --branch main --commit-dirty=true
          echo "Адрес проекта:"
          npx --yes wrangler@4 pages project list | grep -w "$PROJECT" || true
